appId: com.envdeck.app
productName: EnvDeck
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.eslintignore,.prettierignore,.prettierrc,.editorconfig}'
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target: dmg
dmg:
  title: EnvDeck ${version}
  icon: build/icon.icns
  iconSize: 100
  background: build/background.png
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
