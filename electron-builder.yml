appId: com.envdeck.app
productName: EnvDeck
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.eslintignore,.prettierignore,.prettierrc,.editorconfig}'
mac:
  category: public.app-category.developer-tools
  target: dmg
